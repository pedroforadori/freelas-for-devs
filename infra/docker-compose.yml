# Serviços de desenvolvimento local. Uso: pnpm infra:up
# stripe-cli entra na F6 (pagamentos).
name: f4d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: f4d
      POSTGRES_PASSWORD: f4d
      POSTGRES_DB: f4d
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U f4d -d f4d']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction: o BullMQ não pode perder jobs por pressão de memória.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Substituto local do Cloudflare R2 (API S3).
  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: f4d
      MINIO_ROOT_PASSWORD: f4d-local-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]

  minio-buckets:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 f4d f4d-local-secret; do sleep 1; done;
      mc mb --ignore-existing local/f4d-quarantine local/f4d-files;
      mc anonymous set none local/f4d-quarantine local/f4d-files;
      "

  # Antivírus dos uploads (protocolo clamd na porta 3310). Primeira subida baixa as assinaturas (~1–2 min).
  clamav:
    image: clamav/clamav:stable
    ports: ['3310:3310']
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10

  # Caixa de e-mails de desenvolvimento: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  postgres-data:
  redis-data:
  minio-data:
